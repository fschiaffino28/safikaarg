
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safika</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
<h1>SAFIKA</h1>

<div class="topButtons">
<button onclick="openCart()">🛒 Carrito (<span id="cartCount">0</span>)</button>
</div>
</header>

<section class="categories">

<div class="category" onclick="showCategory('remeras')">Remeras</div>
<div class="category" onclick="showCategory('pantalones')">Pantalones</div>
<div class="category" onclick="showCategory('buzos')">Buzos</div>
<div class="category" onclick="showCategory('accesorios')">Accesorios</div>

</section>

<section id="products" class="products"></section>

<div id="productModal" class="modal">
<div class="modalContent">
<button class="closeBtn" onclick="closeProduct()">X</button>

<h2 id="productTitle"></h2>
<p id="productPrice"></p>

<label>Talle</label>
<select id="size">
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
</select>

<label>Color</label>
<select id="color">
<option>Negro</option>
<option>Blanco</option>
<option>Gris</option>
<option>Marrón</option>
</select>

<button class="buyBtn" onclick="addToCart()">Agregar al carrito</button>

</div>
</div>

<div id="cartModal" class="modal">
<div class="modalContent">
<button class="closeBtn" onclick="closeCart()">X</button>

<h2>Carrito</h2>

<div id="cartItems"></div>

<h3 id="cartTotal">Total: $0</h3>

<select>
<option>Mercado Pago</option>
<option>Tarjeta</option>
</select>

<button class="buyBtn">Pagar</button>

</div>
</div>

<script src="app.js"></script>
</body>
</html>
