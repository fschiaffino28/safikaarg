
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safika</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="promo">SAFIKA · Urban Elegance · Nueva colección</div>

<header class="header">
<h1>SAFIKA</h1>

<div class="topButtons">
<button onclick="openCart()">🛒 Carrito (<span id="cartCount">0</span>)</button>
</div>
</header>

<section class="hero">
<div>
<p class="mini">Nueva colección</p>
<h2>Streetwear premium.</h2>
<p>Explorá las categorías y elegí tu estilo.</p>
</div>

<div class="logoBox">
<div class="logo3d">SAFIKA</div>
</div>
</section>

<section class="categories">

<div class="category remeras" onclick="showCategory('remeras')">
<h3>Remeras</h3>
<p>Oversized y boxy fit</p>
</div>

<div class="category pantalones" onclick="showCategory('pantalones')">
<h3>Pantalones</h3>
<p>Cargos y wide pants</p>
</div>

<div class="category buzos" onclick="showCategory('buzos')">
<h3>Buzos</h3>
<p>Hoodies premium</p>
</div>

<div class="category accesorios" onclick="showCategory('accesorios')">
<h3>Accesorios</h3>
<p>Detalles del outfit</p>
</div>

</section>

<section id="products" class="products"></section>

<div id="productModal" class="modal">
<div class="modalContent">

<button class="closeBtn" onclick="closeProduct()">×</button>

<div id="productImage" class="productImage"></div>

<h2 id="productTitle"></h2>

<p id="productPrice"></p>

<label>Talle</label>
<select id="size">
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
</select>

<label>Color</label>
<select id="color">
<option>Negro</option>
<option>Blanco</option>
<option>Gris</option>
<option>Marrón</option>
</select>

<button class="buyBtn" onclick="addToCart()">Agregar al carrito</button>

</div>
</div>

<div id="cartModal" class="modal">
<div class="modalContent">

<button class="closeBtn" onclick="closeCart()">×</button>

<h2>Carrito</h2>

<div id="cartItems"></div>

<h3 id="cartTotal">Total: $0</h3>

<select>
<option>Mercado Pago</option>
<option>Tarjeta</option>
<option>Transferencia</option>
</select>

<button class="buyBtn">Pagar</button>

</div>
</div>

<script src="app.js"></script>

</body>
</html>
